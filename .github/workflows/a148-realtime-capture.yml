name: A148 real-time speed data

on:
  workflow_dispatch:
    inputs:
      smoke_test_only:
        description: Only validate the API key and connectivity
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 3 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: a148-realtime-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
      SEOUL_BUS_API_KEY: ${{ secrets.SEOUL_BUS_API_KEY }}
      COLLECTOR: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/collect_a148_realtime.py
      RECONSTRUCTOR: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/reconstruct_a148_speed.py
      REQUIREMENTS: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/requirements_a148.txt
      DATA_DIR: 吴霞_期刊论文整理/03_图表与实验/source_data/a148_realtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}

      - name: Validate API secret
        shell: bash
        run: |
          if [[ -z "${SEOUL_BUS_API_KEY:-}" ]]; then
            echo "::error::Repository secret SEOUL_BUS_API_KEY is missing."
            exit 2
          fi

      - name: Install reconstruction dependencies
        run: python -m pip install --disable-pip-version-check -r "${REQUIREMENTS}"

      - name: Test Seoul bus API
        run: python "${COLLECTOR}" --once --timeout 25

      - name: Capture the complete A148 round trip
        if: ${{ !inputs.smoke_test_only }}
        run: |
          python "${COLLECTOR}" \
            --interval 15 \
            --duration-minutes 220 \
            --idle-stop-minutes 15 \
            --timeout 25

      - name: Reconstruct the auditable speed data
        if: ${{ !inputs.smoke_test_only }}
        shell: bash
        run: |
          service_day="$(date +%Y%m%d)"
          raw_file="${DATA_DIR}/a148_raw_positions_${service_day}.csv"
          output_file="${DATA_DIR}/a148_reconstructed_speed_profile_${service_day}.csv"
          if [[ ! -s "${raw_file}" ]]; then
            echo "::error::No A148 position data were collected for ${service_day}."
            exit 3
          fi
          python "${RECONSTRUCTOR}" "${raw_file}" \
            --no-plot \
            --output-csv "${output_file}"

      - name: Upload raw data, logs, and reconstructed CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a148-speed-data-${{ github.run_id }}
          path: |
            ${{ env.DATA_DIR }}/a148_raw_positions_*.csv
            ${{ env.DATA_DIR }}/a148_collection_log_*.jsonl
            ${{ env.DATA_DIR }}/a148_reconstructed_speed_profile_*.csv
          if-no-files-found: warn
          retention-days: 90
