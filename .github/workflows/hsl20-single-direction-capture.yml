name: HSL 20 single-direction speed capture

on:
  workflow_dispatch:
    inputs:
      capture_mode:
        description: Choose a connectivity test or three complete Eira-to-Munkkivuori runs
        required: true
        type: choice
        default: smoke_test
        options:
          - smoke_test
          - full_capture
  schedule:
    # 04:30 UTC is 06:30 in Finnish winter time and 07:30 in summer time.
    - cron: "30 4 * * 1-5"

permissions:
  contents: read

concurrency:
  group: hsl20-single-direction-speed-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Europe/Helsinki
      CAPTURE_MODE: ${{ github.event_name == 'schedule' && 'full_capture' || inputs.capture_mode || 'smoke_test' }}
      STATIC_EXTRACTOR: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/prepare_hsl20_static.py
      COLLECTOR: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/collect_hsl20_realtime.py
      RECONSTRUCTOR: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/reconstruct_hsl20_speed.py
      SIGNAL_MATCHER: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/match_hsl20_official_signals.py
      REQUIREMENTS: 吴霞_期刊论文整理/03_图表与实验/redraw_scripts/requirements_hsl20.txt
      DATA_DIR: 吴霞_期刊论文整理/03_图表与实验/source_data/hsl20_realtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}

      - name: Install GTFS-Realtime parser
        run: python -m pip install --disable-pip-version-check -r "${REQUIREMENTS}"

      - name: Run offline self-tests
        run: |
          python "${STATIC_EXTRACTOR}" --self-test
          python "${COLLECTOR}" --self-test
          python "${RECONSTRUCTOR}" --self-test
          python "${SIGNAL_MATCHER}" --self-test

      - name: Extract the current one-direction route, stops, shape, and timetable
        run: python "${STATIC_EXTRACTOR}" --output-dir "${DATA_DIR}"

      - name: Test the HSL realtime endpoint
        if: ${{ env.CAPTURE_MODE == 'smoke_test' }}
        run: python "${COLLECTOR}" --once --timeout 20 --output-dir "${DATA_DIR}"

      - name: Capture three complete Eira-to-Munkkivuori runs
        if: ${{ env.CAPTURE_MODE == 'full_capture' }}
        continue-on-error: true
        run: |
          python "${COLLECTOR}" \
            --interval 5 \
            --duration-minutes 120 \
            --timeout 20 \
            --target-complete-runs 3 \
            --output-dir "${DATA_DIR}"

      - name: Reconstruct all complete single-direction speed profiles
        if: ${{ always() && env.CAPTURE_MODE == 'full_capture' }}
        shell: bash
        run: |
          service_day="$(date +%Y%m%d)"
          prefix="${DATA_DIR}/hsl20_eira_to_munkkivuori_${service_day}"
          complete_count="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get("complete_run_ids") or ([d["complete_run_id"]] if d.get("complete_run_id") else [])))' "${prefix}_collection_summary.json")"
          if [[ "${complete_count}" -gt 0 ]]; then
            python "${RECONSTRUCTOR}" \
              "${prefix}_raw_positions.csv" \
              "${prefix}_shape.csv" \
              --stops "${prefix}_stops.csv" \
              --all-complete \
              --collection-summary "${prefix}_collection_summary.json" \
              --output-csv "${prefix}_speed_profiles.csv" \
              --output-summary "${prefix}_speed_profiles_summary.json"
          else
            echo "No complete run was observed; raw evidence is retained without a speed profile."
          fi

      - name: Publish collection summary
        if: always()
        shell: bash
        run: |
          found_summary=false
          for summary_file in "${DATA_DIR}"/hsl20_*_collection_summary.md; do
            if [[ -f "${summary_file}" ]]; then
              cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
              found_summary=true
            fi
          done
          if [[ "${found_summary}" == false ]]; then
            echo "## HSL route 20 capture" >> "${GITHUB_STEP_SUMMARY}"
            echo "No collection summary was generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload route data, raw evidence, and reconstructed speed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsl20-single-direction-data-${{ github.run_id }}
          path: |
            ${{ env.DATA_DIR }}/hsl20_*_metadata.json
            ${{ env.DATA_DIR }}/hsl20_*_stops.csv
            ${{ env.DATA_DIR }}/hsl20_*_timetable.csv
            ${{ env.DATA_DIR }}/hsl20_*_shape.csv
            ${{ env.DATA_DIR }}/hsl20_*_first_feed.pb
            ${{ env.DATA_DIR }}/hsl20_*_filtered_snapshots.jsonl
            ${{ env.DATA_DIR }}/hsl20_*_raw_positions.csv
            ${{ env.DATA_DIR }}/hsl20_*_collection_log.jsonl
            ${{ env.DATA_DIR }}/hsl20_*_collection_summary.json
            ${{ env.DATA_DIR }}/hsl20_*_collection_summary.md
            ${{ env.DATA_DIR }}/hsl20_*_speed_profile.csv
            ${{ env.DATA_DIR }}/hsl20_*_speed_profile_summary.json
            ${{ env.DATA_DIR }}/hsl20_*_speed_profiles.csv
            ${{ env.DATA_DIR }}/hsl20_*_speed_profiles_summary.json
            ${{ env.DATA_DIR }}/hsl20_*_official_signal_intersections.csv
            ${{ env.DATA_DIR }}/hsl20_*_signals_official_match.csv
            ${{ env.DATA_DIR }}/hsl20_*_signals_official_match_summary.json
            ${{ env.DATA_DIR }}/hsl20_*_helsinki_official_signals.geojson
          if-no-files-found: error
          retention-days: 90

      - name: Verify the three-run capture target
        if: ${{ always() && env.CAPTURE_MODE == 'full_capture' }}
        shell: bash
        run: |
          service_day="$(date +%Y%m%d)"
          summary="${DATA_DIR}/hsl20_eira_to_munkkivuori_${service_day}_collection_summary.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); n=len(d.get("complete_run_ids") or ([d["complete_run_id"]] if d.get("complete_run_id") else [])); print(f"complete_runs={n}/3"); raise SystemExit(0 if n >= 3 else 2)' "${summary}"
